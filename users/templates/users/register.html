<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'users/css/style.css' %}">

</head>

<body>
    <div class="container">
        <a href="{% url 'login' %}" class="back-link">Вернуться обратно</a>
        <h2>Регистрация</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="first_name" placeholder="Введите ваше имя" required>
            <input type="text" name="last_name" placeholder="Введите вашу фамилию" required>
            <input type="email" name="email" placeholder="Введите ваш email" required>
            <input type="password" name="password1" placeholder="Придумайте пароль" required>
            <input type="password" name="password2" placeholder="Подтвердите пароль" required>
            <button type="submit">Создать аккаунт</button>
        </form>
    </div>
</body>

</html>
