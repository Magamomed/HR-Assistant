{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HRMatch{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --sidebar-width: 16rem;
            --content-padding: 2rem;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: #1D3D5F;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 2em;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 0.8em 1.5em;
            font-size: 1rem;
        }

        .sidebar a:hover {
            background-color: #254A70;
        }

        .content {
            margin-left: var(--sidebar-width);
            padding: var(--content-padding);
            padding-top: 4vh;
        }

        .table th, .table td {
            font-size: 1rem;
            padding: 0.8em;
        }

        .badge {
            font-size: 0.9rem;
            padding: 0.5em 1em;
            border-radius: 0.5em;
        }

        img.logo {
            max-width: 9rem;
            height: auto;
            margin-bottom: 1.5em;
        }
    </style>
</head>
<body>

<div class="sidebar text-center">
    <a href="{% url 'dashboard' %}">
        <img src="{% static 'home/img/logo.png' %}" alt="HRMatch Logo" class="logo">
    </a>
    <a href="{% url 'dashboard' %}">Главная страница</a>
    <a href="{% url 'vacancy_list' %}">Вакансии</a>
    <a href="#">Кандидаты</a>
    <a href="{% url 'upload_resume' %}">Загрузка резюме</a>
    <a href="#">Оценка резюме</a>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
